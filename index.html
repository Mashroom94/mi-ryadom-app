<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#5364d8" />
    <meta name="description" content="Мы рядом — тёплые знаки внимания для двоих" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/app-logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/app-logo-180.png" />
    <title>Мы рядом</title>
    <style>
      .app-boot-loader{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;gap:14px;background:#edf5ff;color:#25375d;font:700 1.15rem/1.2 system-ui,-apple-system,"Segoe UI",sans-serif}
      .app-boot-loader img{width:84px;height:76px;object-fit:contain;animation:app-boot-pulse 1.35s ease-in-out infinite}
      @keyframes app-boot-pulse{0%,100%{transform:scale(.96);opacity:.82}50%{transform:scale(1.04);opacity:1}}
      @media (prefers-reduced-motion:reduce){.app-boot-loader img{animation:none}}
    </style>
  </head>
  <body>
    <div id="root"><div class="app-boot-loader" role="status" aria-label="Загрузка приложения"><img src="/icons/app-logo.svg" alt="" /><span>Мы рядом</span></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
